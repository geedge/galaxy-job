### web port
server.port = 8182
### log config
logging.config=classpath:logback.xml
spring.application.name=galaxy-job-executor
spring.profiles.active=executor

### xxl-job admin address list, such as "http://address" or "http://address01,http://address02"
xxl.job.admin.addresses=http://localhost:8181/xxl-job-admin

### xxl-job, access token
xxl.job.accessToken=

### xxl-job executor registry-address: default use address to registry , otherwise use ip:po
xxl.job.executor.appname=galaxy-executor
### xxl-job executor registry-address: default use address to registry , otherwise use ip:port if address is null
xxl.job.executor.address=
### xxl-job executor server-info
xxl.job.executor.ip=
xxl.job.executor.port=8886

### xxl-job executor log-path
xxl.job.executor.logpath=/data/logs/jobhandler
### xxl-job executor log-retention-days
xxl.job.executor.logretentiondays=30

## http pool config
### max connection number
http.pool.max.connection=500

http.pool.request.timeout=10000

http.pool.response.timeout=10000

http.pool.max.per.route=200

http.pool.connect.timeout=30000

### actuator
management.server.servlet.context-path=/actuator
management.health.mail.enabled=false
management.endpoints.web.exposure.include=info, health, beans, env, metrics, mappings, scheduledtasks, sessions, threaddump, docs, logfile, jolokia,prometheus
#详细的应用健康信息
management.endpoint.health.show-details=always

management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}