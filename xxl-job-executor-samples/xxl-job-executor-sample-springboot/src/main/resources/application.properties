# web port
server.port=8081

# log config
logging.config=classpath:logback.xml


### xxl-job admin address list, such as "http://address" or "http://address01,http://address02"
xxl.job.admin.addresses=http://127.0.0.1:8080/xxl-job-admin

### xxl-job executor address
xxl.job.executor.appname=xxl-job-executor-sample
xxl.job.executor.ip=
xxl.job.executor.port=9996

### xxl-job, access token
xxl.job.accessToken=

### xxl-job log path
xxl.job.executor.logpath=./data/applogs/xxl-job/jobhandler
### xxl-job log retention days
xxl.job.executor.logretentiondays=30
http-pool.max-total=500
http-pool.read-timeout=5000
http-pool.default-max-per-route=200
http-pool.connect-timeout=3000
http-pool.socket-timeout=65000
http-pool.connection-request-timeout=300
http-pool.validate-after-inactivity=2000
### click house
clickhouse.url=jdbc:clickhouse://192.168.40.193:8123
clickhouse.driverClassName=ru.yandex.clickhouse.ClickHouseDriver
clickhouse.dbname=tsg_galaxy_v3
clickhouse.username=default
clickhouse.password=111111

### kafka 
spring.kafka.bootstrap-servers=192.168.238.3:9092

spring.kafka.producer.batch-size=65536
spring.kafka.producer.buffer-memory=524288
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=0
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

